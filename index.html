<div id="app"></div>
<script>
(()=>{
'use strict';
const KEY='potencial_data_v3',OLD_KEY='potencial_data_v1';
const DOW=['L','M','X','J','V','S','D'],FULLDOW=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const HABITS=[
{id:'food',title:'Seguir mi plan de alimentación',sub:'Tu dieta actual, sin pan. Las comidas flexibles se gestionan por semana.',days:[0,1,2,3,4,5,6]},
{id:'english',title:'Inglés · 45 minutos',sub:'20 min listening · 15 speaking · 10 vocabulario',days:[0,1,2,3,4,5,6]},
{id:'study',title:'Universidad / TFG · 60 minutos',sub:'Reparte el tiempo según lo que necesites estudiar.',days:[0,1,2,3,4,5,6]},
{id:'read',title:'Leer · 5 minutos',sub:'Solo cinco minutos. Lo importante es la constancia.',days:[0,1,2,3,4,5,6]},
{id:'prayer',title:'Rezar por la mañana',sub:'Sin tiempo mínimo ni cronómetro.',days:[0,1,2,3,4,5,6]},
{id:'gym',title:'Gimnasio',sub:'Entrenamiento de fuerza · lunes a viernes.',days:[0,1,2,3,4]},

{icon:'activity',title:'Alcanzar mi físico prime',desc:'Cinco días fijos de gimnasio (lunes a viernes), cardio inclinado, alimentación acordada y seguimiento semanal del peso. La rutina y la meta física concreta aún las definiremos juntos.'},
{icon:'headphones',title:'Mejorar de verdad mi inglés',desc:'45 minutos cada día: 20 de comprensión auditiva, 15 de conversación y 10 de vocabulario. Aún no hemos fijado un nivel de examen como meta.'},
{icon:'book',title:'Avanzar en la universidad y el TFG',desc:'Una hora diaria dedicada al estudio de las dos asignaturas y al TFG, repartida en función de lo que más lo necesite.'},
{icon:'bookopen',title:'Volver a disfrutar de la lectura',desc:'Cinco minutos al día como mínimo para recuperar el hábito sin agobiarme.'},
{icon:'heart',title:'Conectar con Dios y tratar bien a las personas',desc:'Rezar por la mañana sin duración obligatoria y reflexionar sobre la amabilidad, la paciencia y las decisiones.'},
{icon:'briefcase',title:'Dar mi mejor esfuerzo en el trabajo',desc:'En cada jornada laboral, responder sinceramente Sí o No a la pregunta: «¿He dado lo mejor de mí hoy?».'},
{icon:'sparkles',title:'Cuidar mi bienestar emocional',desc:'Dos sesiones de reflexión semanales: jueves flexible al miércoles o viernes, y domingo fijo. Ninguna tiene hora obligatoria.'}
];
const PATH={
home:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',
activity:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
chart:'<path d="M4 19V5M4 19h16M7 15l4-5 4 3 5-7"/>',
settings:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
check:'<path d="m5 12 4 4L19 6"/>',
briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>',
heart:'<path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.8l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.5a5.5 5.5 0 0 0 0-7.8Z"/>',
book:'<path d="M12 7v14M3 18V5a2 2 0 0 1 2-2h4a3 3 0 0 1 3 3 3 3 0 0 1 3-3h4a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2h-4a3 3 0 0 0-3 3 3 3 0 0 0-3-3H5a2 2 0 0 0-2 2Z"/>',
bookopen:'<path d="M2 5a9 9 0 0 1 10 2 9 9 0 0 1 10-2v14a9 9 0 0 0-10 2 9 9 0 0 0-10-2Z"/><path d="M12 7v14"/>',
headphones:'<path d="M3 14v-2a9 9 0 0 1 18 0v2M6 14v6H4a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h2ZM18 14v6h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-2Z"/>',
sparkles:'<path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3L12 2Z"/>',
chevron:'<path d="m15 18-6-6 6-6"/>',
download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',
upload:'<path d="M12 21V9m-5 5 5-5 5 5M4 7V3h16v4"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/>',
weight:'<rect x="3" y="6" width="18" height="15" rx="3"/><path d="M9 12a3 3 0 0 1 6 0M12 12l2-2"/>'
};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(PATH[name]||PATH.target)+'</svg>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function date(s){return new Date(s+'T12:00:00')}
function shift(s,n){const d=date(s);d.setDate(d.getDate()+n);return fmt(d)}
function today(){return fmt(new Date())}
function dow(s){return (date(s).getDay()+6)%7}
function weekStart(s){return shift(s,-dow(s))}
function dateText(s,options={weekday:'long',day:'numeric',month:'long'}){return date(s).toLocaleDateString('es-ES',options)}
function monthKey(s){return s.slice(0,7)}
function daysOfMonth(s){return new Date(+s.slice(0,4),+s.slice(5,7),0).getDate()}
function nonFuture(s){return s<=today()}
function blank(){return {version:3,created:today(),settings:{name:'Antonio'},days:{},weeks:{},months:{}}}
function valid(v){return v&&v.version===3&&v.days&&v.weeks&&v.months&&v.settings&&typeof v.days==='object'&&typeof v.weeks==='object'}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(valid(v))return v}}catch(e){console.warn('No se pudieron leer los datos',e)}return blank()}
let db=load(),tab='today',selectedDate=today(),analyticsRange=30,flash='',flashTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('No se pudieron guardar tus datos');return false}}
function toast(msg){flash=msg;render();if(flashTimer)clearTimeout(flashTimer);flashTimer=setTimeout(()=>{flash='';render()},2700)}
function dayData(s){return db.days[s]||{}}
function weekData(ws){return db.weeks[ws]||{midweekDay:3,midweek:false,sunday:false,flex:{},weight:null}}
function ensureDay(s){return db.days[s]||(db.days[s]={})}
function ensureWeek(ws){return db.weeks[ws]||(db.weeks[ws]={midweekDay:3,midweek:false,sunday:false,flex:{},weight:null})}
function done(s,id){return !!dayData(s).habits?.[id]}
function toggleHabit(s,id){if(!nonFuture(s)||s<db.created)return;const habit=HABITS.find(x=>x.id===id);if(!habit||!habit.days.includes(dow(s)))return;const d=ensureDay(s);d.habits=d.habits||{};d.habits[id]=!d.habits[id];save();render()}
function setWork(s,value){if(!nonFuture(s)||s<db.created)return;if(dow(s)>=5)return;ensureDay(s).work=value;save();render()}
function setNote(s,value){ensureDay(s).kindness=value;save()}
function setGymNote(s,value){ensureDay(s).gymNote=value;save()}
function setWeek(ws,patch){Object.assign(ensureWeek(ws),patch);save();render()}
function toggleFlex(ws,id){const w=ensureWeek(ws);w.flex=w.flex||{};w.flex[id]=!w.flex[id];save();render()}
function weigh(ws,kg){const v=Number(String(kg).trim().replace(',','.'));if(!Number.isFinite(v)||v<20||v>400){toast('Introduce un peso válido en kilogramos.');return}const w=ensureWeek(ws);w.weight={kg:Math.round(v*100)/100,date:today()};save();toast('Peso semanal guardado');}
function completed(s){return HABITS.filter(x=>x.days.includes(dow(s))&&done(s,x.id)).length}
function total(s){return HABITS.filter(x=>x.days.includes(dow(s))).length}
function weeksForWeights(){return Object.entries(db.weeks).filter(([,w])=>w.weight&&Number.isFinite(+w.weight.kg)).sort((a,b)=>b[0].localeCompare(a[0]))}
function monthDates(ym){const y=+ym.slice(0,4),m=+ym.slice(5,7),num=new Date(y,m,0).getDate();return Array.from({length:num},(_,i)=>ym+'-'+String(i+1).padStart(2,'0')).filter(x=>x>=db.created&&x<=today())}
const NAV=[['today','home','Hoy'],['week','calendar','Semana'],['gym','activity','Gimnasio'],['analytics','chart','Evolución'],['goals','target','Mis metas'],['settings','settings','Ajustes']];
function header(){return `<aside class="sidebar"><div class="brand"><div class="logo">P</div><div><strong>POTENCIAL</strong><small>TU CAMINO · TU RITMO</small></div></div><div class="nav-label">TU ESPACIO</div><nav class="nav" aria-label="Navegación">${NAV.map(([id,ico,label])=>`<button class="nav-btn ${tab===id?'active':''}" data-action="nav" data-tab="${id}" ${tab===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`).join('')}</nav><div class="side-bottom"><strong>${esc(db.settings.name||'Tu espacio')}</strong>Tu progreso se guarda únicamente en este navegador. Sin datos ficticios.</div></aside><section class="content"><header class="topbar"><div class="topbar-title">${esc(NAV.find(x=>x[0]===tab)?.[2]||'Hoy')}</div><div class="topbar-right">${esc(dateText(today()))}</div></header><main class="main" id="main">${flash?`<div class="simple-note" role="status" style="margin-bottom:17px">${esc(flash)}</div>`:''}`}
function footer(){return `<footer class="footer">POTENCIAL · Solo tus compromisos acordados · Datos privados en este navegador. Esta página no sincroniza información entre dispositivos.</footer></main></section>`}
function pageHead(kicker,title,desc){return `<div class="page-head"><div class="section-eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>`}
function checkbox(id,checked,extra='',disabled=false){return `<button class="tick ${checked?'checked':''}" data-action="${id}" ${extra} aria-pressed="${checked}" ${disabled?'disabled':''}>${icon('check')}</button>`}
function renderToday(){
 const s=selectedDate,d=dayData(s),hs=HABITS.filter(x=>x.days.includes(dow(s))),doneCount=completed(s),pct=Math.round(doneCount/Math.max(1,hs.length)*100),ws=weekStart(s),w=weekData(ws),isToday=s===today(),editable=nonFuture(s)&&s>=db.created;
 const work=d.work||'',weekday=dow(s)<5;
 const title=isToday?`Hola, ${esc((db.settings.name||'').trim().split(/\s+/)[0]||'Antonio')}.`:'Tu día, a tu ritmo.';
 return `<div class="stack">
 <section class="card hero accent"><div><div class="section-eyebrow">${isToday?'HOY IMPORTA':'TU CONSTANCIA DIARIA'}</div><h1>${title}</h1><p>La meta es cumplir los compromisos que has elegido. No tienes que hacerlo perfecto para seguir avanzando.</p><div class="summarybar"><span class="pill">${doneCount} de ${hs.length} hábitos</span><span class="pill neutral">${weekday?'Día de gimnasio':'Descanso de gimnasio'}</span></div></div><div class="hero-mark" style="--prog:${pct}%"><div><strong>${pct}%</strong><span>Del día</span></div></div></section>
 <div class="grid">
 <section class="card"><div class="card-head"><div><h2>Mis compromisos</h2><p>Lo que realmente te has propuesto para hoy.</p></div><div class="day-nav"><button class="round" data-action="day-prev" aria-label="Día anterior" ${s<=db.created?'disabled':''}>‹</button><span>${isToday?'Hoy':esc(dateText(s,{day:'numeric',month:'short'}))}</span><button class="round" data-action="day-next" aria-label="Día siguiente" ${s>=today()?'disabled':''}>›</button></div></div><div class="habits-list">${hs.map(x=>`<div class="habit-row ${done(s,x.id)?'done':''} ${!editable?'disabled':''}">${checkbox('toggle-habit',done(s,x.id),`data-id="${x.id}" data-date="${s}" aria-label="${esc(x.title)}"`,!editable)}<div class="habit-copy"><strong>${esc(x.title)}</strong><p>${esc(x.sub)}</p></div></div>`).join('')}</div><p class="steps-caption">El sábado y el domingo son descanso del gimnasio y del cardio: no cuentan como fallos.</p></section>
 <div class="today-aside">
 ${weekday?`<section class="card"><div class="card-head"><div><h2>Al terminar el trabajo</h2><p>¿Hoy he dado lo mejor de mí?</p></div></div><div class="status-grid"><button class="status-btn ${work==='yes'?'selected':''}" data-action="work" data-value="yes" data-date="${s}" ${!editable?'disabled':''}>Sí</button><button class="status-btn ${work==='no'?'selected no':''}" data-action="work" data-value="no" data-date="${s}" ${!editable?'disabled':''}>No</button></div><button class="link" data-action="work" data-value="off" data-date="${s}" style="margin-top:10px" ${!editable?'disabled':''}>${work==='off'?'✓ No he trabajado hoy':'No he trabajado hoy'}</button><p class="field-help">Es una reflexión sincera, no una nota sobre tu valor personal.</p></section>`:''}
 <section class="card"><div class="card-head"><div><h2>Amabilidad y paciencia</h2><p>Reflexión libre, sin puntuaciones.</p></div></div><label class="form-label" for="kindness-note">¿Cómo he tratado a los demás hoy?</label><textarea class="field" id="kindness-note" data-date="${s}" placeholder="Algo que agradezco, algo que puedo mejorar..." ${!editable?'disabled':''}>${esc(d.kindness||'')}</textarea><p class="field-help">Se guarda al salir del campo. Puedes dejarlo vacío.</p></section>
 <section class="card"><div class="card-head"><div><h2>Esta semana</h2><p>Solo dos recordatorios importantes.</p></div><button class="link" data-action="nav" data-tab="week">Ver semana</button></div><div class="weekly-tile"><b>Registro de peso</b><span class="pill ${w.weight?'':'neutral'}">${w.weight?'Registrado':'Pendiente'}</span></div><div class="weekly-tile"><b>Reflexión personal</b><span>${Number(!!w.midweek)+Number(!!w.sunday)} de 2</span></div><p class="steps-caption">Jueves flexible y domingo, sin horario fijo.</p></section></div></div></div>`;
}
function weeklyCards(ws){
 const w=weekData(ws),dayOptions=[2,3,4].map(i=>`<option value="${i}" ${w.midweekDay===i?'selected':''}>${FULLDOW[i]}</option>`).join('');
 return `<section class="card"><div class="card-head"><div><h2>Mis sesiones de reflexión</h2><p>Dos espacios semanales, sin fijar horas.</p></div><span class="pill neutral">${Number(!!w.midweek)+Number(!!w.sunday)} / 2</span></div>
 <div class="session-card"><div class="session-head"><h3>Entre semana</h3><span class="pill neutral">Flexible</span></div><p>Por defecto, jueves. Puedes cambiarla al miércoles o viernes sin penalización.</p><label for="sessionday" class="form-label">Día de esta semana</label><select class="field" id="sessionday" data-week="${ws}">${dayOptions}</select><div class="session-foot"><small>Sin hora fija · Duración orientativa: 1 h</small><button class="btn ${w.midweek?'ghost':'primary'}" data-action="session" data-which="midweek" data-week="${ws}">${w.midweek?'✓ Realizada · Desmarcar':'Marcar realizada'}</button></div></div>
 <div class="session-card"><div class="session-head"><h3>Domingo</h3><span class="pill neutral">Día fijo</span></div><p>Revisión de la semana, emociones, decisiones y aprendizajes.</p><div class="session-foot"><small>Sin hora fija · Duración orientativa: 1 h</small><button class="btn ${w.sunday?'ghost':'primary'}" data-action="session" data-which="sunday" data-week="${ws}">${w.sunday?'✓ Realizada · Desmarcar':'Marcar realizada'}</button></div></div></section>`;
}
function weightCard(ws){
 const w=weekData(ws),weight=w.weight,all=weeksForWeights();
 return `<section class="card"><div class="card-head"><div><h2>Mi peso semanal</h2><p>Un registro cada semana, sin día ni hora obligatorios.</p></div><span class="pill ${weight?'':'neutral'}">${weight?'✓ Hecho':'Pendiente'}</span></div>
 <form id="weight-form" data-week="${ws}"><label class="form-label" for="weight">Peso en kilogramos</label><div class="field-row"><input class="field" type="text" inputmode="decimal" id="weight" name="kg" placeholder="Ej.: 77,5" value="${weight?esc(String(weight.kg).replace('.',',')):''}" required><button class="btn primary" type="submit">Guardar</button></div></form><p class="field-help">La meta es registrar el dato con regularidad. No hemos establecido un peso objetivo ni lo deduciremos de una sola medición.</p>
 ${weight?`<div class="simple-note" style="margin-top:16px">Último registro de esta semana: <strong>${esc(weight.kg)} kg</strong> · ${esc(dateText(weight.date,{day:'numeric',month:'long'}))}</div>`:''}
 ${all.length?`<div class="weight-list"><div class="kicker">Historial semanal</div>${all.slice(0,5).map(([k,v])=>`<div class="weight-item"><span>Semana del ${esc(dateText(k,{day:'numeric',month:'short'}))}</span><strong>${esc(v.weight.kg)} kg</strong></div>`).join('')}</div>`:''}</section>`;
}
function renderWeek(){
 const ws=weekStart(today()),w=weekData(ws),start=Math.max(0,0),end=shift(ws,6);
 const weekHabitIds=['gym','cardio','english','study','read'];
 const rates=weekHabitIds.map(id=>{const h=HABITS.find(x=>x.id===id);const scheduled=Array.from({length:7},(_,i)=>shift(ws,i)).filter(x=>h.days.includes(dow(x))&&x>=db.created);return {id,label:h.title,done:scheduled.filter(x=>done(x,id)).length,target:scheduled.length};});
 return pageHead('REVISIÓN SEMANAL','Una semana a la vez','Lo semanal complementa tus compromisos diarios. No convierte un día difícil en un fracaso.')+
 `<div class="stack"><section class="card"><div class="card-head"><div><h2>Semana del ${esc(dateText(ws,{day:'numeric',month:'long'}))}</h2><p>Tu organización de lunes a domingo.</p></div><span class="pill neutral">Sin horarios obligatorios</span></div><div class="week-strip">${Array.from({length:7},(_,i)=>{const d=shift(ws,i);return `<div class="day-cell ${d===today()?'active':''} ${d>today()?'future':''} ${d<db.created?'before':''}"><strong>${DOW[i]}</strong><span>${date(d).getDate()}</span><small>${i<5?'Gym':'Descanso'}</small></div>`}).join('')}</div><div class="summarybar">${rates.map(r=>`<span class="pill neutral">${esc(r.id==='gym'?'Gym':r.id==='cardio'?'Cardio':r.id==='english'?'Inglés':r.id==='study'?'Estudio':'Lectura')}: ${r.done}/${r.target}</span>`).join('')}</div></section>
 <div class="grid">${weightCard(ws)}<section class="card"><div class="card-head"><div><h2>Comidas flexibles</h2><p>Una de cada tipo por semana. Sin compensaciones.</p></div><span class="pill neutral">${['breakfast','lunch','dinner'].filter(x=>w.flex?.[x]).length} de 3</span></div>
 ${[['breakfast','Desayuno flexible'],['lunch','Comida flexible'],['dinner','Cena flexible']].map(([id,label])=>`<div class="checkline">${checkbox('flex',!!w.flex?.[id],`data-which="${id}" data-week="${ws}"`)}<div><strong>${label}</strong><small>${w.flex?.[id]?'Registrada esta semana':'Disponible esta semana'}</small></div></div>`).join('')}<p class="steps-caption">Se trata de flexibilidad dentro del plan alimentario, no de una comida que debas «ganarte».</p></section></div>
 ${weeklyCards(ws)}</div>`;
}
function renderGym(){
 const ws=weekStart(today()),gymCount=[0,1,2,3,4].filter(i=>done(shift(ws,i),'gym')).length,cardioCount=[0,1,2,3,4].filter(i=>done(shift(ws,i),'cardio')).length,da=dayData(today());
 return pageHead('FÍSICO PRIME','Mi gimnasio','Cinco días fijos de lunes a viernes. Sábado y domingo: recuperación. No he inventado una rutina de ejercicios que todavía no hemos diseñado.')+

function analyseSpan(length,offset=0){
 const until=shift(today(),-1-length*offset),from=shift(until,1-length),dates=[],rows=[];
 for(let i=0;i<length;i++){
  const dt=shift(from,i);
  if(dt<db.created||dt>shift(today(),-1))continue;
  const habits=HABITS.filter(h=>h.days.includes(dow(dt)));
  const marked=habits.filter(h=>done(dt,h.id));
  dates.push(dt);rows.push({date:dt,expected:habits.length,done:marked.length,hasMark:marked.length>0});
 }
 const total=rows.reduce((n,r)=>n+r.expected,0),hits=rows.reduce((n,r)=>n+r.done,0);
 return {length,offset,from,until,dates,rows,total,hits,rate:total?Math.round(100*hits/total):null,logged:rows.filter(r=>r.hasMark).length};
}
function analyticsTone(value){
 if(value===null||value===undefined||!Number.isFinite(value))return 'neutral';
 return value>=85?'good':value>=60?'mid':'low';
}

}
function analyticBarChart(){
 const yesterday=shift(today(),-1),currentWeek=weekStart(yesterday),weeks=[];
 for(let i=7;i>=0;i--){
  const start=shift(currentWeek,-7*i),end=shift(start,6),dates=[];
  for(let j=0;j<7;j++){const dt=shift(start,j);if(dt>=db.created&&dt<=yesterday)dates.push(dt)}
  const den=dates.reduce((n,dt)=>n+total(dt),0),num=dates.reduce((n,dt)=>n+completed(dt),0),logs=dates.filter(dt=>completed(dt)>0).length;
  const rate=den?Math.round(100*num/den):null;
  weeks.push({start,end,rate,logs,days:dates.length,total:den,num});
 }
 if(!weeks.some(w=>w.logs>0))return `<div class="analytics-chart-empty">Todavía no hay hábitos completados registrados.<br>La gráfica crecerá conforme marques tus días.</div>`;
 return `<div class="analytics-chart-wrap"><div class="analytics-chart-grid">${weeks.map(w=>`<div class="analytics-bar-slot" title="Semana ${esc(dateText(w.start,{day:'numeric',month:'short'}))}: ${w.num}/${w.total} compromisos registrados"><span class="analytics-bar-value">${w.days?`${w.rate}%`:'—'}</span><div class="analytics-bar ${!w.logs?'zero':analyticsTone(w.rate)}" style="height:${!w.logs?2:Math.max(w.rate,1)}%"></div></div>`).join('')}</div><div class="analytics-bar-labels">${weeks.map(w=>`<span>${esc(dateText(w.start,{day:'numeric',month:'short'}))}</span>`).join('')}</div></div><p class="legend">Cada barra es una semana, desde el inicio de tu seguimiento. La actual puede estar incompleta; los días futuros nunca se incluyen.</p>`;
}

  const dt=shift(start,i),past=dt>=db.created,den=total(dt),num=completed(dt),rated=past?Math.round(100*num/Math.max(den,1)):null,tone=!past?'unlogged':!num?'unlogged':analyticsTone(rated),title=past?`${dateText(dt)}: ${num} de ${den} hábitos registrados`:`${dateText(dt)}: antes del inicio de tu seguimiento`;

 if(action==='export'){download('POTENCIAL_copia_'+today()+'.json',JSON.stringify(db,null,2));return}
 if(action==='export-legacy'){const raw=localStorage.getItem(OLD_KEY);if(raw)download('POTENCIAL_datos_anteriores_'+today()+'.json',raw);return}
 if(action==='reset'){if(confirm('¿Quieres borrar todos los registros de la versión nueva? Los datos antiguos no se tocarán.')&&confirm('Última confirmación: ¿eliminar el progreso actual?')){db=blank();save();tab='today';selectedDate=today();render()}return}
});
document.addEventListener('change',e=>{
 const x=e.target;
 if(x.id==='sessionday'){const ws=weekStart(today()),v=Number(x.value);if([2,3,4].includes(v))setWeek(ws,{midweekDay:v})}
 if(x.id==='kindness-note')setNote(x.dataset.date,x.value);
 if(x.id==='gymnote')setGymNote(today(),x.value);
 if(x.id==='monthnote'){const ym=monthKey(today());db.months[ym]=db.months[ym]||{};db.months[ym].review=x.value;save()}
 if(x.id==='importfile'){const f=x.files?.[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!valid(d))throw Error('Formato incompatible');if(!confirm('¿Sustituir los registros actuales por los del archivo? Descarga una copia antes.'))return;db=d;save();tab='today';selectedDate=today();render();toast('Datos importados')}catch(err){toast('No se pudieron importar los datos: archivo incompatible')}})}
});
document.addEventListener('submit',e=>{
 const form=e.target;
 if(form.id==='weight-form'){e.preventDefault();weigh(form.dataset.week,new FormData(form).get('kg'))}
 if(form.id==='name-form'){e.preventDefault();db.settings.name=String(new FormData(form).get('name')||'').trim().slice(0,50)||'Antonio';save();render()}
});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const d=JSON.parse(e.newValue);if(valid(d)){db=d;render()}}catch(err){}}});
save();render();
})();
</script>
</body></html>
