function metric(ic,label,value,foot){return `<div class="card metric-card"><div class="metric-top"><span class="metric-label">${label}</span><span class="metric-icon">${icon(ic)}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`}
function lineGraph(values,max=100){const width=610,height=173,pad=10,top=12,bottom=156,w=width-2*pad,hh=bottom-top;const points=values.map((v,i)=>[pad+(values.length===1?0:i*w/(values.length-1)),bottom-(Math.max(0,Math.min(max,v||0))/max)*hh]);const line=points.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');return `<svg class="stat-line" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Gráfico de evolución de cumplimiento">${[0,25,50,75,100].map(p=>`<line x1="0" x2="${width}" y1="${bottom-hh*p/100}" y2="${bottom-hh*p/100}" stroke="#2d3b50" stroke-dasharray="3 7"/>`).join('')}<defs><linearGradient id="fill-potential" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#76e5bd" stop-opacity=".24"/><stop offset="1" stop-color="#76e5bd" stop-opacity="0"/></linearGradient></defs>${points.length>=2?`<path d="${line} L${points.at(-1)[0]},${bottom} L${points[0][0]},${bottom}Z" fill="url(#fill-potential)"/>`:''}<path d="${line}" fill="none" stroke="#77e8c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${points.length?`<circle cx="${points.at(-1)[0]}" cy="${points.at(-1)[1]}" r="5" fill="#77e8c2" stroke="#103a32" stroke-width="3"/>`:''}</svg>`}
function habitTrend(days=14){return rangeDates(days).map(date=>{let expected=0,done=0;for(const habit of db.habits){if(scheduledHabit(habit,date)){expected++;if(completion(habit.id,date))done++}}return expected?pct(done,expected):0})}
function headingCard(title,small,action=''){return `<div class="card-heading"><div><h2>${title}</h2>${small?`<p>${small}</p>`:''}</div>${action}</div>`}
function actionLink(tabName,label='Ver todo'){return `<button class="link-btn" data-action="nav" data-tab="${tabName}">${label} ${icon('chevron',13)}</button>`}
function insightList(){const items=[];const cur=habitStats(7);const prev=habitStats(7,shift(today(),-7));if(cur.expected){const diff=cur.rate-prev.rate;items.push({title:diff>=0?'Tu regularidad está creciendo':'Puedes recuperar tu ritmo',detail:`Cumplimiento esta semana: ${cur.rate}%${prev.expected?` (${diff>=0?'+':''}${diff} puntos frente a la anterior)`:''}.`,ic:'trend'})}if(db.goals.length){const closest=[...db.goals].filter(g=>goPct(g)<100&&g.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0];if(closest)items.push({title:'Tu próximo objetivo',detail:`«${closest.title}» vence el ${prettyDate(closest.deadline,{day:'numeric',month:'long'})}. Vas por el ${goPct(closest)}%.`,ic:'target'})}const overdue=db.tasks.filter(t=>t.status!=='done'&&t.deadline&&t.deadline<today()).length;if(overdue)items.push({title:'Hay tareas por revisar',detail:`Tienes ${overdue} tarea${overdue===1?'':'s'} con fecha pasada. Actualiza su planificación.`,ic:'calendar'});if(!items.length)items.push({title:'Tu primer paso',detail:'Añade un objetivo y dos hábitos. Tras unos días empezaremos a detectar tendencias con tus datos.',ic:'sparkles'});return items.slice(0,3).map(x=>`<div class="insight"><div class="insight-mark">${icon(x.ic)}</div><div><h4>${h(x.title)}</h4><p>${h(x.detail)}</p></div></div>`).join('')}

const named=!!db.settings.setupNameConfirmed,goal=db.goals.length>0,habit=db.habits.length>0,n=[named,goal,habit].filter(Boolean).length;
return `<div class="setup-wrap"><div class="eyebrow">PRIMEROS PASOS</div><div class="setup-hero"><div class="setup-topline"><span>CONFIGURA TU ESPACIO</span><span>${n}/3 pasos</span></div><h1>Vamos a hacerlo sencillo.</h1><p>Primero decidimos qué quieres conseguir y qué hábitos vas a construir. El resto puede esperar.</p><div class="setup-track"><span style="width:${Math.round(n/3*100)}%"></span></div></div><div class="setup-steps">

<section class="setup-step"><div class="setup-step-number">${goal?icon('check'):'2'}</div><div><h2>Tu primer objetivo</h2><p>Empieza con una meta concreta que te importe de verdad.</p>${goal?`<div class="setup-existing">${h(db.goals[0].title)}</div>`:''}<button class="btn ${goal?'ghost':'primary'}" data-action="add-goal">${icon('plus')} ${goal?'Añadir otro objetivo':'Definir mi objetivo'}</button></div></section>
<section class="setup-step"><div class="setup-step-number">${habit?icon('check'):'3'}</div><div><h2>Tu primer hábito</h2><p>Una acción pequeña que quieras repetir.</p>${habit?`<div class="setup-existing">${h(db.habits[0].name)}</div>`:''}<button class="btn ${habit?'ghost':'primary'}" data-action="add-habit">${icon('plus')} ${habit?'Añadir otro hábito':'Crear un hábito'}</button></div></section>
</div><div class="setup-end"><div><strong>${goal&&habit?'Ya tienes lo esencial.':'Un paso cada vez.'}</strong><p>${goal&&habit?'Empieza a registrar tu progreso sin distracciones.':'Un objetivo y un hábito son suficientes para empezar.'}</p></div><button class="btn primary" data-action="finish-setup" ${goal&&habit?'':'disabled'}>Entrar en mi espacio ${icon('arrow')}</button></div><p class="setup-footnote">Los datos se guardan en este navegador; todavía no hay sincronización entre dispositivos.</p></div>`}
function renderDashboard(){const name=(db.settings.name||'').trim().split(/\s+/)[0]||'hoy',hs=todayHabitStats(),now=today(),goals=db.goals.slice(0,2),tasks=db.tasks.filter(x=>x.status!=='done').slice(0,3);if(!db.habits.length&&!db.goals.length)return `<div class="setup-wrap"><div class="setup-hero"><h1>Todo empieza con un primer paso.</h1><p>Configura un objetivo y un hábito para empezar.</p><button class="btn primary" data-action="nav" data-tab="setup">Configurar mi espacio ${icon('arrow')}</button></div></div>`;
return `${db.settings.planPreset===PERSONAL_PLAN_ID&&db.settings.planWelcome?`<div class="personal-ready"><div>${icon('sparkles',18)} <span><strong>Tu plan está preparado.</strong> He organizado tus estudios, TFG, desarrollo profesional y hábitos. Puedes editarlo cuando quieras.</span></div><button class="btn ghost" data-action="dismiss-personal-welcome">Entendido</button></div>`:(!db.settings.planPreset?`<div class="personal-ready"><div>${icon('sparkles',18)} <span>He preparado una hoja de ruta para ti. Puedes añadirla sin perder tus registros.</span></div><button class="btn subtle-btn" data-action="apply-personal-plan">Añadir mi plan</button></div>`:'')}<div class="simple-head"><div><div class="eyebrow">TU DÍA</div><h1>Hola, ${h(name)}.</h1><p>Hoy solo necesitas centrarte en lo importante.</p></div><span>${h(new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))}</span></div><div class="simple-metrics"><div><small>Hábitos de hoy</small><strong>${hs.done.length} <em>/ ${hs.scheduled.length}</em></strong></div><div><small>Objetivos</small><strong>${db.goals.length}</strong></div><div><small>Tareas pendientes</small><strong>${db.tasks.filter(x=>x.status!=='done').length}</strong></div></div><div class="simple-grid">
<section class="card simple-card">${headingCard('Hábitos de hoy','Marca los que completes',actionLink('habits','Ver hábitos'))}${hs.scheduled.length?hs.scheduled.map(x=>`<div class="habit-row"><button class="habit-check ${completion(x.id,now)?'done':''}" data-action="toggle-habit" data-id="${x.id}" data-date="${now}" aria-label="Completar hábito">${icon('check')}</button><div class="habit-info"><div class="item-name">${h(x.name)}</div><div class="item-desc">${h(x.area)}</div></div></div>`).join(''):empty('checkcircle','Sin hábitos para hoy','Define tu rutina semanal.','Añadir hábito','add-habit')}</section>
<section class="card simple-card">${headingCard('Tus objetivos','Las metas que has elegido',actionLink('goals','Ver objetivos'))}${goals.length?goals.map(g=>`<div class="simple-goal"><div><strong>${h(g.title)}</strong><span>${goPct(g)}%</span></div><div class="progress"><span class="progress-fill" style="width:${goPct(g)}%"></span></div><button class="link-btn" data-action="progress-goal" data-id="${g.id}">Actualizar avance ${icon('arrow',13)}</button></div>`).join(''):empty('target','Sin objetivos','Empieza con una meta.','Crear objetivo','add-goal')}</section></div><section class="card simple-card simple-tasks">${headingCard('Siguientes pasos','Tus acciones pendientes',actionLink('tasks','Ver tareas'))}${tasks.length?tasks.map(t=>`<div class="task-row"><button class="check-circle" data-action="toggle-task" data-id="${t.id}">${icon('check')}</button><div class="task-info"><div class="item-name">${h(t.title)}</div><div class="item-desc">${h(t.area)}</div></div></div>`).join(''):empty('list','Sin tareas pendientes','Añade lo que necesites.','Nueva tarea','add-task')}</section>`}
function renderGoals(){const sorted=[...db.goals].sort((a,b)=>goPct(b)-goPct(a));const finished=sorted.filter(g=>goPct(g)>=100).length;return pageHeading('DIRECCIÓN Y PROPÓSITO','Mis objetivos','Convierte tus ambiciones en metas concretas. Mide resultados, no únicamente horas.',`<button class="btn primary" data-action="add-goal">${icon('plus')} Nuevo objetivo</button>`)+`<div class="grid-3" style="margin-bottom:22px">${metric('target','Objetivos activos',db.goals.length-finished,'Objetivos en desarrollo')}${metric('checkcircle','Objetivos conseguidos',finished,'Metas alcanzadas')}${metric('chart','Avance medio',overallProgress()+'%','Progreso de todos los objetivos')}</div><div class="section-head"><div><h2>Todos tus objetivos</h2><p>Actualiza tu avance a medida que obtengas resultados verificables.</p></div></div>${sorted.length?`<div class="goal-cards">${sorted.map(g=>`<div class="card goal-card"><div class="goal-card-top">${areaBadge(g.area)}<div class="item-actions"><button class="small-icon" data-action="edit-goal" data-id="${g.id}" title="Editar">${icon('edit')}</button><button class="small-icon" data-action="delete" data-kind="goal" data-id="${g.id}" title="Eliminar">${icon('trash')}</button></div></div><h3>${h(g.title)}</h3><p>${h(g.description||'Objetivo de evolución personal')}</p><div class="progress-labels"><span>${unit(g.current,g.unit)} de ${unit(g.target,g.unit)}</span><strong>${goPct(g)}%</strong></div><div class="progress"><span class="progress-fill" style="width:${goPct(g)}%;background:${areas[g.area]?.color||'#72e4bd'}"></span></div><div class="goal-meta"><span>${icon('calendar',13)} ${dueText(g.deadline)}</span><button class="btn subtle-btn" data-action="progress-goal" data-id="${g.id}" style="min-height:31px;padding:0 11px">${icon('plus',13)} Registrar avance</button></div></div>`).join('')}</div>`:empty('target','El futuro empieza por una meta','Establece un objetivo realista y cuantificable. Puedes crear tantos como necesites.','Crear mi primer objetivo','add-goal')}`}
function weekDates(){const d=today();return rangeDates(7,shift(d,6-weekday(d)))}
function calendarMonth(){const d=today(),first=d.slice(0,8)+'01',startDay=weekday(first);const [year,month]=d.split('-').map(Number);const days=new Date(year,month,0).getDate();let out=Array.from({length:startDay},()=>'<div class="cal-day blank"></div>');for(let day=1;day<=days;day++){const date=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;let total=0,done=0;for(const hab of db.habits){if(scheduledHabit(hab,date)){total++;if(completion(hab.id,date))done++}}const percent=pct(done,total),lvl=percent>=90?'level3':percent>=55?'level2':percent>0?'level1':'';out.push(`<div title="${prettyDate(date)} · ${done}/${total}" class="cal-day ${lvl} ${date===d?'today':''} ${date>d?'future':''}">${day}</div>`)}return out.join('')}
function renderHabits(){const ht=todayHabitStats(),week=weekDates(),cur=habitStats(7);const habits=[...db.habits].sort((a,b)=>Number(scheduledHabit(b,today()))-Number(scheduledHabit(a,today())));return pageHeading('PEQUEÑAS ACCIONES · GRANDES CAMBIOS','Mis hábitos','La constancia no consiste en ser perfecto: consiste en volver a intentarlo y construir una rutina sostenible.',`<button class="btn primary" data-action="add-habit">${icon('plus')} Nuevo hábito</button>`)+`<div class="grid-3" style="margin-bottom:21px">${metric('checkcircle','Completados hoy',`${ht.done.length}/${ht.scheduled.length}`,'Solo cuenta lo previsto para hoy')}${metric('chart','Constancia semanal',`${cur.rate}%`,'De los hábitos programados')}${metric('flame','Mejor racha actual',`${Math.max(0,...db.habits.map(streak))} días`,'Días programados consecutivos')}</div><div class="habit-layout"><div class="card">${headingCard('Tu rutina','Marca un hábito al completarlo. Puedes revisar los últimos siete días.',`<button class="link-btn" data-action="add-habit">${icon('plus',14)} Añadir</button>`)}${habits.length?habits.map(x=>{const isToday=scheduledHabit(x,today());return `<div class="habit-big-row"><button class="habit-check ${completion(x.id,today())?'done':''}" data-action="toggle-habit" data-id="${x.id}" data-date="${today()}" ${!isToday?'disabled title="No está programado hoy"':''} aria-label="Marcar ${h(x.name)}">${icon('check')}</button><div><div class="item-name">${h(x.name)}</div><div class="item-desc">${h(x.area)} · ${x.schedule.length===7?'Todos los días':x.schedule.map(i=>['L','M','X','J','V','S','D'][i]).join(', ')} · Racha ${streak(x)}</div></div><div class="item-actions"><button class="small-icon" data-action="edit-habit" data-id="${x.id}" title="Editar hábito">${icon('edit')}</button><button class="small-icon" data-action="delete" data-kind="habit" data-id="${x.id}" title="Eliminar hábito">${icon('trash')}</button></div><div class="week-dots">${week.map(date=>`<button class="day-dot" style="border:0;background:none;padding:0;cursor:${scheduledHabit(x,date)&&date<=today()?'pointer':'default'}" data-action="toggle-habit" data-id="${x.id}" data-date="${date}" ${!scheduledHabit(x,date)||date>today()?'disabled':''} title="${prettyDate(date,{weekday:'long',day:'numeric',month:'long'})}"><span>${dayLabel(date)}</span><span class="${completion(x.id,date)?'done':!scheduledHabit(x,date)?'off':''}">${completion(x.id,date)?icon('check',12):''}</span></button>`).join('')}</div></div>`}).join(''):empty('checkcircle','Aún no tienes hábitos','Empieza con dos o tres hábitos fáciles de mantener.','Crear hábito','add-habit')}</div><div class="stack"><div class="card">${headingCard('Calendario de constancia',new Date().toLocaleDateString('es-ES',{month:'long',year:'numeric'}))}<div class="calendar-header">${['L','M','X','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div><div class="habit-calendar">${calendarMonth()}</div><p class="stat-note">Cuanto más intenso el color, mayor porcentaje de hábitos completados ese día.</p></div><div class="card">${headingCard('Cómo se calcula','Sin puntos arbitrarios')}<p class="help-text">Tu constancia es el porcentaje de hábitos completados entre los que tenías programados. Los días que no tocaba realizar un hábito no cuentan como fallos.</p><div class="notice mt-18">La racha cuenta días programados consecutivos; el día actual no rompe una racha hasta que termina.</div></div></div></div>`}
function taskPriority(t){return t.priority==='high'?'<span class="chip pink">Alta</span>':t.priority==='medium'?'<span class="chip orange">Media</span>':'<span class="chip blue">Baja</span>'}
function renderTasks(){const statusLabels={todo:'Por hacer',doing:'En marcha',done:'Completadas'},statuses=['todo','doing','done'];const groups=statuses.map(s=>({id:s,items:db.tasks.filter(t=>t.status===s).sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'))}));return pageHeading('ORGANIZACIÓN','Mis tareas','Ordena tus próximos pasos por prioridad y estado. Cada tarea debe acercarte a un objetivo.',`<button class="btn primary" data-action="add-task">${icon('plus')} Nueva tarea</button>`)+`<div class="grid-3" style="margin-bottom:21px">${metric('list','Pendientes',db.tasks.filter(x=>x.status==='todo').length,'Tareas por empezar')}${metric('activity','En marcha',db.tasks.filter(x=>x.status==='doing').length,'En las que estás trabajando')}${metric('checkcircle','Terminadas',db.tasks.filter(x=>x.status==='done').length,'Resultados registrados')}</div><div class="task-board">${groups.map(group=>`<div class="board-column"><div class="board-title"><h3><span class="priority-dot ${group.id==='done'?'low':group.id==='doing'?'medium':'high'}"></span>${statusLabels[group.id]}</h3><span class="chip">${group.items.length}</span></div>${group.items.length?group.items.map(t=>`<div class="task-card"><div class="row-between">${areaBadge(t.area)}<div class="item-actions"><button class="small-icon" data-action="edit-task" data-id="${t.id}" title="Editar">${icon('edit')}</button><button class="small-icon" data-action="delete" data-kind="task" data-id="${t.id}" title="Eliminar">${icon('trash')}</button></div></div><h4>${h(t.title)}</h4><div class="row-between">${taskPriority(t)}<span class="task-meta">${icon('calendar',12)} ${dueText(t.deadline)}</span></div><div class="task-card-foot"><span>${t.goalId?`Objetivo: ${h(db.goals.find(x=>x.id===t.goalId)?.title?.slice(0,25)||'Eliminado')}`:'Tarea independiente'}</span><button class="link-btn" data-action="cycle-task" data-id="${t.id}" title="Cambiar estado">${group.id==='todo'?'Empezar':group.id==='doing'?'Completar':'Reabrir'} ${icon('arrow',13)}</button></div></div>`).join(''):`<p class="help-text center" style="margin:30px 2px">No hay tareas en esta columna.</p>`}</div>`).join('')}</div>`}

function timeStr(secs){const m=Math.floor(secs/60),s=secs%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}

us-stats"><div class="focus-stat"><strong>${(minutes/60).toLocaleString('es-ES',{maximumFractionDigits:1})} h</strong><span>Esta semana (7 días)</span></div><div class="focus-stat"><strong>${(focusMinutes(30)/60).toLocaleString('es-ES',{maximumFractionDigits:1})} h</strong><span>Últimos 30 días</span></div><div class="focus-stat"><strong>${db.focusSessions.filter(s=>rangeDates(7).includes(s.date)).length}</strong><span>Sesiones esta semana</span></div><div class="focus-stat"><strong>${db.focusSessions.length}</strong><span>Sesiones totales</span></div></div></div><div class="card">${headingCard('Sesiones recientes','Historial de concentración')}${sessions.length?sessions.map(s=>`<div class="stat-item"><div class="stat-item-icon">${icon('clock')}</div><div><b>${h(s.area||'Personal')}</b><p>${prettyDate(s.date,{weekday:'short',day:'numeric',month:'short'})}</p></div><strong>${Math.round(s.minutes)} min</strong><button class="small-icon" data-action="delete" data-kind="focus" data-id="${s.id}" title="Eliminar sesión">${icon('trash')}</button></div>`).join(''):empty('clock','Todavía no hay sesiones','Empieza una sesión y guarda tu tiempo de concentración.')}</div></div></div>`}

function renderStats(){const stats=habitStats(range),allDates=rangeDates(range),daily=allDates.map(date=>{let exp=0,done=0;for(const hab of db.habits){if(scheduledHabit(hab,date)){exp++;if(completion(hab.id,date))done++}}return exp?pct(done,exp):0}),weekly=[],weeklyNames=[];for(let i=0;i<allDates.length;i+=7){const chunk=allDates.slice(i,i+7);weekly.push(Math.round(avg(chunk.map(d=>{let ex=0,dn=0;for(const ha of db.habits)if(scheduledHabit(ha,d)){ex++;if(completion(ha.id,d))dn++}return ex?pct(dn,ex):0}))));weeklyNames.push(prettyDate(chunk[0],{day:'numeric',month:'short'}))}const sessions=db.focusSessions.filter(s=>allDates.includes(s.date)),doneTasks=db.tasks.filter(t=>t.status==='done'&&allDates.includes(t.completedAt||t.created)),finishedGoals=db.goals.filter(g=>goPct(g)>=100);const last91=rangeDates(91);const heat=last91.map(date=>{const num=(db.completions[date]||[]).length+db.focusSessions.filter(s=>s.date===date).length+db.tasks.filter(t=>t.completedAt===date).length;return `<span class="heatbox ${num>=5?'h3':num>=3?'h2':num>=1?'h1':''}" title="${prettyDate(date)}: ${num} acciones"></span>`}).join('');return pageHeading('ANALÍTICA PERSONAL','Tus estadísticas','Los números deben ayudarte a tomar decisiones, nunca a castigarte por descansar.',`<div class="segmented">${[7,30,90].map(n=>`<button data-action="stats-range" data-days="${n}" class="${range===n?'active':''}">${n} días</button>`).join('')}</div>`)+`<div class="grid-4" style="margin-bottom:18px">${metric('checkcircle','Cumplimiento',`${stats.rate}%`,`${stats.done} de ${stats.expected} hábitos`)}${metric('clock','Concentración',`${(focusMinutes(range)/60).toLocaleString('es-ES',{maximumFractionDigits:1})} h`,`${sessions.length} sesiones`)}${metric('list','Tareas finalizadas',doneTasks.length,'En este período')}${metric('target','Metas completadas',finishedGoals.length,`${db.goals.length} objetivos en total`)}</div><div class="stats-layout"><div class="card">${headingCard('Cumplimiento diario',`Porcentaje de hábitos programados realizados · ${range} días`)}<div class="row-between"><span class="chart-legend"><span class="legend-dot"></span> Porcentaje diario</span><span class="chip mint">${stats.rate}% global</span></div>${lineGraph(daily)}<div class="chart-labels"><span>${prettyDate(allDates[0])}</span><span>${prettyDate(allDates[Math.floor(allDates.length/2)])}</span><span>Hoy</span></div></div><div class="card">${headingCard('Resumen de actividad','Acciones registradas en el período')}<div class="stat-item"><div class="stat-item-icon">${icon('checkcircle')}</div><div><b>Hábitos realizados</b><p>Acciones de constancia</p></div><strong>${stats.done}</strong></div><div class="stat-item"><div class="stat-item-icon">${icon('clock')}</div><div><b>Sesiones de enfoque</b><p>Trabajo profundo registrado</p></div><strong>${sessions.length}</strong></div><div class="stat-item"><div class="stat-item-icon">${icon('list')}</div><div><b>Tareas realizadas</b><p>Resultados operativos</p></div><strong>${doneTasks.length}</strong></div><div class="stat-item"><div class="stat-item-icon">${icon('book')}</div><div><b>Reflexiones escritas</b><p>Registros de diario</p></div><strong>${db.journal.filter(j=>allDates.includes(j.date)).length}</strong></div></div></div><div class="grid-2 mt-18"><div class="card">${headingCard('Cumplimiento por bloques','Comparativa de períodos de hasta siete días')}${bars(weekly,weeklyNames)}<p class="stat-note">Los bloques parciales y los días sin hábitos programados se muestran con un valor de 0%. El porcentaje global excluye los días sin hábitos previstos.</p></div><div class="card">${headingCard('Mapa de actividad','Últimos 91 días')}<div class="heatmap">${heat}</div><div class="heat-legend">Menos actividad <span class="heatbox"></span><span class="heatbox h1"></span><span class="heatbox h2"></span><span class="heatbox h3"></span> Más actividad</div><p class="stat-note">Se cuentan hábitos marcados, sesiones de concentración y tareas terminadas. No representa una medición científica de tu potencial.</p></div></div><div class="card mt-18">${headingCard('Lecturas de tus datos','Conclusiones basadas en información registrada')}<div class="grid-3" style="gap:17px">${insightList()}</div></div>`}
function renderJournal(){const current=db.journal.find(x=>x.date===today()),entries=[...db.journal].sort((a,b)=>b.date.localeCompare(a.date)),moodCurrent=current?.mood||moodDraft;return pageHeading('AUTOCONOCIMIENTO','Mi diario personal','Registra cómo te sientes, qué has conseguido y qué puedes aprender de tu día.')+`<div class="journal-layout"><div class="card">${headingCard('Tu reflexión de hoy',prettyDate(today(),{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}<form id="journal-form"><input type="hidden" name="mood" id="mood-input" value="${moodCurrent}"><div class="field"><span class="field-title">¿Cómo te has sentido hoy?</span><div class="mood-options">${[['1','😣','Muy mal'],['2','😕','Bajo'],['3','😐','Normal'],['4','🙂','Bien'],['5','🤩','Genial']].map(([n,emoji,lbl])=>`<button type="button" data-action="mood" data-mood="${n}" class="mood-option ${Number(moodCurrent)===Number(n)?'selected':''}"><span>${emoji}</span>${lbl}</button>`).join('')}</div></div><div class="field"><label for="energy">Nivel de energía (1–5)</label><select name="energy" id="energy">${[1,2,3,4,5].map(n=>`<option value="${n}" ${(current?.energy||3)===n?'selected':''}>${n} / 5</option>`).join('')}</select></div><div class="field"><label for="win">¿Qué has conseguido hoy?</label><textarea id="win" name="win" placeholder="Un avance del que estés orgulloso...">${h(current?.win||'')}</textarea></div><div class="field"><label for="learning">¿Qué has aprendido?</label><textarea id="learning" name="learning" placeholder="Una idea, habilidad o lección...">${h(current?.learning||'')}</textarea></div><div class="field"><label for="reflection">¿Qué mejorarías mañana?</label><textarea id="reflection" name="reflection" placeholder="Una decisión o ajuste pequeño y concreto...">${h(current?.reflection||'')}</textarea></div><button type="submit" class="btn primary">${icon('save')} ${current?'Actualizar reflexión':'Guardar reflexión'}</button></form></div><div class="card">${headingCard('Tu tray function notify(msg,isError=false){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast ${isError?'error':''}">${icon(isError?'info':'checkcircle')}${h(msg)}</div>`;if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3300)}

function toggleHabit(id,date){const habit=db.habits.find(x=>x.id===id);if(!habit||date>today()||!scheduledHabit(habit,date))return;const prev=db.completions[date]||[];if(prev.includes(id)){db.completions[date]=prev.filter(x=>x!==id);if(!db.completions[date].length)delete db.completions[date]}else db.completions[date]=[...prev,id];save();render()}
function markTask(id,nextStatus){const t=db.tasks.find(x=>x.id===id);if(!t)return;t.status=nextStatus;t.completedAt=nextStatus==='done'?today():undefined;save();render();notify(nextStatus==='done'?'¡Tarea completada!':'Estado actualizado')}
function formText(form,name){return String(new FormData(form).get(name)||'').trim()}
function formNum(form,name){return Number(formText(form,name)||0)}
function upsert(array,item){const index=array.findIndex(x=>x.id===item.id);if(index<0)array.push(item);else array[index]=item}
function saveModal(form){if(!modal)return;const {kind,id}=modal;const existing={goal:db.goals.find(x=>x.id===id),habit:db.habits.find(x=>x.id===id),task:db.tasks.find(x=>x.id===id),method:db.methods.find(x=>x.id===id)}[kind];
if(kind==='goal'){const target=formNum(form,'target'),current=formNum(form,'current');if(!(target>0)||current<0||!Number.isFinite(target)||!Number.isFinite(current)){notify('Introduce un valor de meta válido y un avance no negativo.',true);return}const obj={...existing,id:existing?.id||uid(),title:formText(form,'title'),area:formText(form,'area'),description:formText(form,'description'),target,current,unit:formText(form,'unit'),deadline:formText(form,'deadline'),created:existing?.created||today()};upsert(db.goals,obj)}
else if(kind==='progress'){const obj=db.goals.find(x=>x.id===id),curr=formNum(form,'current');if(!obj||curr<0||!Number.isFinite(curr)){notify('El avance debe ser un número positivo.',true);return}obj.current=curr}
else if(kind==='habit'){const days=[...form.querySelectorAll('input[name="day"]:checked')].map(x=>Number(x.value));if(!days.length){notify('Selecciona al menos un día de la semana.',true);return}const obj={...existing,id:existing?.id||uid(),name:formText(form,'name'),area:formText(form,'area'),schedule:days.sort((a,b)=>a-b),created:existing?.created||today()};upsert(db.habits,obj)}
else if(kind==='task'){const status=formText(form,'status'),obj={...existing,id:existing?.id||uid(),title:formText(form,'title'),area:formText(form,'area'),priority:formText(form,'priority'),status,deadline:formText(form,'deadline'),goalId:formText(form,'goalId'),created:existing?.created||today(),completedAt:status==='done'?(existing?.completedAt||today()):undefined};upsert(db.tasks,obj)}
else if(kind==='method'){const start=formText(form,'start'),end=formText(form,'end');if(start&&end&&end<start){notify('La fecha final no puede preceder a la inicial.',true);return}const obj={...existing,id:existing?.id||uid(),title:formText(form,'title'),area:formText(form,'area'),hypothesis:formText(form,'hypothesis'),start,end,status:formText(form,'status'),score:formText(form,'score'),result:formText(form,'result')};upsert(db.methods,obj)}
else return;
save();closeModal();render();notify('Cambios guardados correctamente')}
function remove(kind,id){const labels={goal:'objetivo',habit:'hábito',task:'tarea',focus:'sesión de enfoque',journal:'entrada del diario',method:'método'};if(!window.confirm(`¿Eliminar ${labels[kind]||'elemento'}? Esta acción no se puede deshacer.`))return;
if(kind==='goal'){db.goals=db.goals.filter(x=>x.id!==id);db.tasks.forEach(t=>{if(t.goalId===id)t.goalId=''})}
if(kind==='habit'){db.habits=db.habits.filter(x=>x.id!==id);for(const date of Object.keys(db.completions)){db.completions[date]=(db.completions[date]||[]).filter(x=>x!==id);if(!db.completions[date].length)delete db.completions[date]}}
if(kind==='task')db.tasks=db.tasks.filter(x=>x.id!==id);
if(kind==='focus')db.focusSessions=db.focusSessions.filter(x=>x.id!==id);
if(kind==='journal')db.journal=db.journal.filter(x=>x.date!==id);
if(kind==='method')db.methods=db.methods.filter(x=>x.id!==id);
save();render();notify('Registro eliminado')}
function downloadJson(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`POTENCIAL_copia_${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Copia descargada correctamente')}
async function importJson(file){if(!file)return;if(file.size>5_000_000){notify('El archivo supera el límite de 5 MB.',true);return}try{const contents=await file.text();const obj=JSON.parse(contents);if(!validData(obj))throw Error('Formato incompatible');if(!window.confirm('¿Sustituir los datos actuales por los de esta copia? Exporta una copia antes de continuar.'))return;db={...obj,focusTimer:obj.focusTimer||defaultTimer()};save();tab=needsSetup()?'setup':'dashboard';render({scroll:true});notify('Tus datos se han importado correctamente')}catch(e){notify('No se ha podido importar: archivo no válido.',true)}}
function startReal(){if(!window.confirm('¿Empezar con tus datos reales? Se quitarán los ejemplos ficticios. Puedes exportar una copia antes de continuar.'))return;db=blankData();tab='setup';save();closeModal();render({scroll:true});notify('Tu espacio personal está listo')}
function setDemo(){if(!window.confirm('¿Sustituir tu información actual por datos ficticios de demostración? Exporta una copia antes de continuar.'))return;db=seedDemo();tab='setup';save();render({scroll:true});notify('Modo de demostración activado')}
function resetAll(){if(!window.confirm('¿ELIMINAR TODOS TUS DATOS? Esta acción es irreversible si no tienes una copia.'))return;if(!window.confirm('Última confirmación: se borrarán objetivos, hábitos, tareas, diario y estadísticas.'))return;db=blankData();tab='setup';save();render({scroll:true});notify('Todos los registros se han borrado')}
function saveJournal(form){const obj={date:today(),mood:Number(formText(form,'mood')||4),energy:formNum(form,'energy'),win:formText(form,'win'),learning:formText(form,'learning'),reflection:formText(form,'reflection')};const idx=db.journal.findIndex(j=>j.date===obj.date);if(idx===-1)db.journal.push(obj);else db.journal[idx]=obj;save();render();notify('Reflexión guardada')}
function updateTimerUI(){if(tab!=='focus')return;const rem=secondsRemaining(),clock=document.getElementById('focus-clock'),ring=document.getElementById('focus-ring');if(!clock||!ring)return;clock.textContent=timeStr(rem);ring.style.setProperty('--focus-progress',`${Math.max(0,Math.min(100,pct(db.focusTimer.duration-rem,db.focusTimer.duration)))}%`);const status=document.getElementById('focus-status');if(status)status.textContent=db.focusTimer.running?'EN CURSO':'LISTO PARA EMPEZAR';const finishBtn=document.querySelector('[data-action="focus-complete"]');if(finishBtn)finishBtn.disabled=rem>=db.focusTimer.duration}
function finishFocus(auto=false){const t=db.focusTimer,elapsed=Math.max(0,t.duration-secondsRemaining()),mins=Math.round(elapsed/6)/10;if(mins>=0.2){db.focusSessions.push({id:uid(),date:today(),minutes:mins,area:t.area||'Personal'});notify(auto?'¡Sesión completada y registrada!':`Sesión de ${mins.toLocaleString('es-ES')} min guardada`)}else if(!auto)notify('Necesitas al menos 12 segundos para registrar una sesión.',true);db.focusTimer={...defaultTimer(),duration:t.duration,remaining:t.duration,area:t.area};save();render()}
function onTimer(){if(db.focusTimer.running && secondsRemaining()<=0){finishFocus(true);return}updateTimerUI()}
function mobileMenu(show){const side=document.getElementById('sidebar');side.classList.toggle('open',show);let overlay=document.getElementById('mobile-overlay');if(!overlay){overlay=document.createElement('div');overlay.id='mobile-overlay';overlay.className='mobile-overlay';document.body.appendChild(overlay);overlay.addEventListener('click',()=>mobileMenu(false))}overlay.classList.toggle('show',show)}
function navigate(target){tab=target;closeModal();mobileMenu(false);render({scroll:true})}
document.addEventListener('click',event=>{
const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
if(action==='close-overlay'&&event.target===el){closeModal();return}
if(action==='close-modal'){closeModal();return}
if(action==='mobile-menu'){mobileMenu(true);return}
if(action==='nav'){navigate(el.dataset.tab);return}
if(action==='apply-personal-plan'){applyPersonalPlan();return}
if(action==='restore-personal-plan'){restorePreviousPlan();return}
if(action==='dismiss-personal-welcome'){db.settings.planWelcome=false;save();render();return}
if(action==='toggle-extra'){advancedOpen=!advancedOpen;renderNav();return}
if(action==='finish-setup'){if(!db.goals.length||!db.habits.length){notify('Define un objetivo y un hábito.',true);return}db.settings.setupFinished=true;save();navigate('dashboard');notify('POTENCIAL ya está configurado');return}
if(action==='quick'){openModal('quick');return}
if(action.startsWith('add-')){openModal(action.slice(4));return}
if(action.startsWith('edit-')){openModal(action.slice(5),id);return}
if(action==='progress-goal'){openModal('progress',id);return}
if(action==='toggle-habit'){toggleHabit(id,el.dataset.date);return}
if(action==='toggle-task'){markTask(id,'done');return}
if(action==='cycle-task'){const t=db.tasks.find(x=>x.id===id);if(t)markTask(id,t.status==='todo'?'doing':t.status==='doing'?'done':'todo');return}
if(action==='delete'){remove(el.dataset.kind,id);return}
if(action==='stats-range'){range=Number(el.dataset.days);render();return}
if(action==='mood'){moodDraft=Number(el.dataset.mood);const inp=document.getElementById('mood-input');if(inp)inp.value=moodDraft;document.querySelectorAll('.mood-option').forEach(n=>n.classList.toggle('selected',Number(n.dataset.mood)===moodDraft));return}
if(action==='start-real'){startReal();return}
if(action==='load-demo'){setDemo();return}
if(action==='reset-all'){resetAll();return}
if(action==='export'){downloadJson();return}
if(action==='focus-duration'){const min=Number(el.dataset.minutes);if(db.focusTimer.running){notify('Pausa o termina la sesión antes de cambiar la duración.',true);return}db.focusTimer={...defaultTimer(),duration:min*60,remaining:min*60,area:db.focusTimer.area};save();render();return}
if(action==='focus-toggle'){const t=db.focusTimer;if(t.running){t.remaining=secondsRemaining();t.running=false;t.startedAt=null}else{if(t.remaining<=0)t.remaining=t.duration;t.startedAt=Date.now();t.running=true}save();render();return}
if(action==='focus-reset'){const t=db.focusTimer;if(t.duration-secondsRemaining()>60&&!window.confirm('¿Reiniciar la sesión sin guardar el tiempo dedicado?'))return;db.focusTimer={...defaultTimer(),duration:t.duration,remaining:t.duration,area:t.area};save();render();return}
if(action==='focus-complete'){finishFocus(false);return}
});
document.addEventListener('submit',event=>{const form=event.target;if(form.id==='modal-form'){event.preventDefault();saveModal(form)}if(form.id==='profile-form'){event.preventDefault();db.settings.name=formText(form,'name').slice(0,50)||'Tú';db.settings.setupNameConfirmed=true;save();render();notify('Nombre guardado')}if(form.id==='journal-form'){event.preventDefault();saveJournal(form)}});
document.addEventListener('change',async event=>{const el=event.target;if(el.id==='import-file'){await importJson(el.files?.[0]);el.value=''}else if(el.id==='focusArea'){db.focusTimer.area=el.value;save()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(modal)closeModal();else mobileMenu(false)}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openModal('quick')}});
window.addEventListener('storage',event=>{if(event.key!==KEY||!event.newValue)return;try{const d=JSON.parse(event.newValue);if(validData(d)){db=d;render();notify('Los datos se han actualizado desde otra pestaña')}}catch{}});
render();onTimer();setInterval(onTimer,1000);
})();

  </script>
</body>
</html>
